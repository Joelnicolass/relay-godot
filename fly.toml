# Fly.io: `fly deploy` from this folder. The app name is global on Fly: change it for your own copy.
# The host secret is not here: `fly secrets set RELAY_HOST_SECRET=...` (see README).
# One machine that never stops: rooms live in its memory, and an idle stop would cut open WebSockets.
app = "relay-godot"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
